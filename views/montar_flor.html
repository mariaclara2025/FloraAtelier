<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora Atelier - Montagem de Flor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <nav class="bg-white border-b border-purple-100 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <span class="font-serif font-extrabold text-xl text-purple-700">Engenharia • Montar Flor</span>
            <a href="/dashboard" class="text-xs font-semibold text-purple-600 hover:underline">← Voltar ao Dashboard</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-8 w-full flex-grow">
        <div class="bg-white border border-purple-100 rounded-3xl shadow-sm p-8 space-y-6">
            <div class="border-b border-slate-100 pb-4">
                <h1 class="font-serif text-xl font-bold text-slate-900">Registo de Receita de Flor</h1>
                <p class="text-xs text-slate-400">Defina os insumos e hastes necessários para produzir uma flor artesanal.</p>
            </div>

            <form action="/montar_flor" method="POST" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 uppercase">Nome da Flor</label>
                    <input type="text" name="nome_flor" required placeholder="Ex: Tulipa de Chenille" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 uppercase">Quantidade de Hastes Utilizadas</label>
                    <input type="number" name="hastes" required placeholder="Ex: 3" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none font-mono">
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs py-3.5 rounded-xl uppercase tracking-wider transition-all">
                    Salvar Receita da Flor
                </button>
            </form>
        </div>
    </main>

    <footer class="text-slate-400 text-[11px] py-6 text-center border-t border-slate-100 bg-white">
        &copy; 2026 Flora Atelier • Engenharia de Produção.
    </footer>
</body>
</html>
