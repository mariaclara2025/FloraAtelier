<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora Atelier - Detalhes do Buquê</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-purple-100 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🌸</span>
                <span class="font-serif font-extrabold text-xl tracking-wide text-purple-700">Flora Atelier</span>
            </div>
            <a href="/catalogo" class="text-xs font-semibold text-purple-600 hover:underline">← Voltar ao Catálogo</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12 w-full flex-grow">
        <div class="bg-white border border-purple-100 rounded-3xl shadow-sm p-8 md:p-12 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            <div class="bg-gradient-to-br from-purple-100 to-pink-100 aspect-square rounded-2xl flex items-center justify-center text-6xl shadow-inner">
                💐
            </div>
            <div class="space-y-6">
                <div class="space-y-2">
                    <span class="text-[10px] font-bold text-purple-600 bg-purple-50 px-3 py-1 rounded-md uppercase tracking-wider"><%= produto.tipo %></span>
                    <h1 class="font-serif text-3xl font-bold text-slate-900"><%= produto.nome %></h1>
                    <p class="text-sm text-slate-500 leading-relaxed"><%= produto.descricao %></p>
                </div>
                <div class="border-t border-slate-100 pt-4 flex items-center justify-between">
                    <span class="font-mono font-bold text-purple-700 text-2xl">R$ <%= produto.preco.toFixed(2) %></span>
                </div>
                <form action="/adicionar_carrinho" method="POST" class="pt-2">
                    <input type="hidden" name="produto_id" value="<%= produto.id %>">
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs py-4 rounded-xl shadow-md uppercase tracking-wider transition-all">
                        🛒 Adicionar ao Carrinho
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-slate-400 text-[11px] py-6 text-center border-t border-slate-100 bg-white">
        &copy; 2026 Flora Atelier
    </footer>
</body>
</html>
