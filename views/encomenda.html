<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora Atelier - Encomenda Personalizada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-purple-100 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">💐</span>
                <span class="font-serif font-extrabold text-xl tracking-wide text-purple-700">Encomenda Personalizada</span>
            </div>
            <a href="/catalogo" class="text-xs font-semibold text-purple-600 hover:underline">← Voltar ao Catálogo</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-8 w-full flex-grow">
        <div class="bg-white border border-purple-100 rounded-3xl shadow-sm p-8 space-y-6">
            <div class="border-b border-slate-100 pb-4">
                <h1 class="font-serif text-xl font-bold text-slate-900">Monte o seu Buquê Exclusivo</h1>
                <p class="text-xs text-slate-400">Preencha os detalhes para solicitar uma criação única em chenille.</p>
            </div>

            <form action="/encomenda" method="POST" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 uppercase">Tema ou Ocasião</label>
                    <input type="text" name="tema" required placeholder="Ex: Aniversário, Cores Van Gogh, Tangled..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 uppercase">Descrição das Cores e Flores Desejadas</label>
                    <textarea name="detalhes" rows="4" placeholder="Ex: Girassóis e tulipas em tons pastéis com embalagem lilás..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs py-3.5 rounded-xl uppercase tracking-wider transition-all">
                    Enviar Solicitação de Encomenda
                </button>
            </form>
        </div>
    </main>

    <footer class="text-slate-400 text-[11px] py-6 text-center border-t border-slate-100 bg-white">
        &copy; 2026 Flora Atelier
    </footer>
</body>
</html>
