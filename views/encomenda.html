<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora Atelier - Encomenda Personalizada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f0ff',
                            100: '#ebdeff',
                            200: '#dac2ff',
                            300: '#c199ff',
                            400: '#a366ff',
                            500: '#8b33ff',
                            600: '#751ae6',
                            700: '#6010bf',
                            800: '#500e9e',
                            950: '#1b003a',
                        },
                        accent: {
                            pink: '#f472b6',
                            lavender: '#e9d5ff'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&family=Playfair+Display:wght=600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-purple-100 px-6 py-4">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🌸</span>
                <span class="font-serif font-extrabold text-xl tracking-wide bg-gradient-to-r from-brand-600 to-accent-pink bg-clip-text text-transparent">Flora Atelier</span>
            </div>
            <a href="/catalogo" class="text-xs font-semibold text-slate-600 hover:text-brand-500 transition-colors">
                ← Voltar
            </a>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-6 py-12 w-full flex-grow flex items-center justify-center">
        <div class="bg-white border border-purple-100 rounded-3xl shadow-xl p-6 md:p-8 w-full space-y-6">
            
            <div class="text-center space-y-2">
                <h1 class="font-serif text-2xl md:text-3xl font-black text-slate-900">Arranjo Personalizado</h1>
                <p class="text-xs text-slate-500 max-w-sm mx-auto leading-relaxed">
                    Escolha os elementos básicos do acervo para que o nosso artesão monte um orçamento sob medida para o seu evento ou presente.
                </p>
            </div>

            <form action="/encomenda_personalizada" method="POST" class="space-y-5">
                
                <div class="space-y-1.5">
                    <label for="flor" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">
                        Flor Principal de Chenille
                    </label>
                    <select id="flor" name="flor" required 
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-400 focus:bg-white transition-all appearance-none cursor-pointer text-slate-700">
                        <option value="" disabled selected>Selecione o tipo de flor...</option>
                        {% for flor in flores %}
                            <option value="{{ flor.nome }} - {{ flor.cor }}">{{ flor.nome }} ({{ flor.cor }})</option>
                        {% else %}
                            <option value="Padrão">Estoque em atualização - Fale conosco</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label for="embalagem" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">
                        Estilo de Embalagem / Embrulho
                    </label>
                    <select id="embalagem" name="embalagem" required 
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-400 focus:bg-white transition-all appearance-none cursor-pointer text-slate-700">
                        <option value="" disabled selected>Selecione a embalagem...</option>
                        {% for emb in embalagens %}
                            <option value="{{ emb.nome }} - {{ emb.cor }}">{{ emb.nome }} ({{ emb.cor }})</option>
                        {% else %}
                            <option value="Padrão">Estoque em atualização</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label for="qtd_flores" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">
                        Quantidade Estimada de Hastes
                    </label>
                    <input type="number" id="qtd_flores" name="qtd_flores" min="1" required placeholder="Ex: 15"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-400 focus:bg-white transition-all text-slate-700">
                </div>

                <div class="space-y-1.5">
                    <label for="mensagem" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">
                        Mensagem para o Cartão de Oferta <span class="text-slate-400 font-normal">(Opcional)</span>
                    </label>
                    <textarea id="mensagem" name="mensagem" rows="3" placeholder="Escreva uma dedicatória especial aqui..."
                              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-400 focus:bg-white transition-all text-slate-700 resize-none"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                            class="w-full bg-brand-500 text-white font-semibold text-sm py-4 rounded-xl hover:bg-brand-600 shadow-md shadow-brand-100 transition-all transform hover:-translate-y-0.5 text-center cursor-pointer border-none">
                        🚀 Solicitar Orçamento Personalizado
                    </button>
                </div>

            </form>
        </div>
    </main>

    <footer class="text-slate-400 text-[11px] py-6 text-center border-t border-slate-100 bg-white">
        &copy; 2026 Flora Atelier. Pedidos manuais sob consulta de stock.
    </footer>

</body>
</html>
