<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Flora Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 via-slate-50 to-pink-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="bg-white border border-purple-100 rounded-3xl shadow-xl p-8 max-w-md w-full space-y-6">
            
            <!-- Cabeçalho no padrão Flora Atelier -->
            <div class="text-center space-y-2">
                <span class="text-4xl">🔮</span>
                <h1 class="font-serif font-black text-2xl tracking-wide text-purple-700">Finalizar Pedido</h1>
                <p class="text-xs text-slate-400">Preencha os dados de entrega e pagamento para concluir.</p>
            </div>

            <form action="/info_compra" method="POST" class="space-y-4">
                
                <!-- Seção: Dados de Entrega -->
                <div class="border-b border-slate-100 pb-2">
                    <span class="text-xs font-bold text-purple-600 uppercase tracking-wider">Dados de Entrega (Cliente)</span>
                </div>

                <div class="flex flex-col space-y-1.5">
                    <label for="endereco" class="text-xs font-bold text-slate-500 uppercase">Endereço de Entrega:</label>
                    <textarea 
                        id="endereco" 
                        name="endereco" 
                        rows="3"
                        placeholder="Rua, número, bairro, complemento e CEP" 
                        required
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100 transition-all resize-none"></textarea>
                </div>

                <div class="flex flex-col space-y-1.5">
                    <label for="telefone" class="text-xs font-bold text-slate-500 uppercase">Telefone de Contato:</label>
                    <input 
                        type="tel" 
                        id="telefone" 
                        name="telefone" 
                        placeholder="(00) 00000-0000" 
                        required
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100 transition-all">
                </div>

                <!-- Seção: Pagamento -->
                <div class="border-b border-slate-100 pb-2 pt-2">
                    <span class="text-xs font-bold text-purple-600 uppercase tracking-wider">Pagamento (Pedido)</span>
                </div>

                <div class="flex flex-col space-y-1.5">
                    <label for="forma_pagamento" class="text-xs font-bold text-slate-500 uppercase">Forma de Pagamento:</label>
                    <select 
                        id="forma_pagamento" 
                        name="forma_pagamento" 
                        required
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100 transition-all text-slate-700">
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="PIX">PIX</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                        <option value="Dinheiro na Entrega">Dinheiro na Entrega</option>
                    </select>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-purple-600 text-white font-bold text-sm py-3.5 rounded-xl hover:bg-purple-700 shadow-md shadow-purple-200 transition-all">
                        Continuar para Finalização
                    </button>
                </div>
                
            </form>

            <!-- Link de retorno -->
            <div class="border-t border-slate-100 pt-4 text-center text-xs text-slate-400">
                Precisa revisar os itens? <a href="/carrinho" class="text-purple-600 font-bold hover:underline">Voltar ao carrinho</a>
            </div>

        </div>
    </main>
</body>
</html>
