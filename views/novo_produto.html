<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora Atelier - Novo Produto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">
    <main class="max-w-2xl mx-auto px-6 py-12 w-full flex-grow">
        <div class="bg-white border border-purple-100 rounded-3xl shadow-sm p-8 space-y-6">
            <div class="border-b border-slate-100 pb-4">
                <h1 class="font-serif text-xl font-bold text-slate-900">Cadastrar Novo Produto</h1>
                <p class="text-xs text-slate-400">Adicione novos buquês ou flores de chenille ao catálogo.</p>
            </div>

            <% if (typeof mensagem !== 'undefined' && mensagem) { %>
                <div class="bg-purple-50 border border-purple-200 text-purple-700 text-xs px-4 py-3 rounded-xl font-medium">
                    <%= mensagem %>
                </div>
            <% } %>

            <form action="/novo_produto" method="POST"  class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 uppercase">Nome do Produto</label>
                    <input type="text" name="nome" required placeholder="Ex: Buquê Girassol Van Gogh" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 uppercase">Descrição</label>
                    <textarea name="descricao" rows="3" placeholder="Detalhes dos materiais..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none resize-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase">Preço (R$)</label>
                        <input type="number" step="0.01" name="preco" required placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none font-mono">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase">Categoria / Tipo</label>
                        <input type="text" name="tipo" required placeholder="Buquê ou Flor Avulsa" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase">Tamanho</label>
                        <input type="text" name="tamanho" placeholder="Ex: Pequeno, Médio, Grande" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase">Cor Principal</label>
                        <input type="text" name="cor_principal" placeholder="Ex: Vermelho, Amarelo, Pastel" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 uppercase">Imagem do Produto</label>
                    <input type="file" id="seletor-imagem" accept="image/*" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-500 outline-none file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:uppercase file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 file:cursor-pointer transition-all">
                    <input type="hidden" name="imagem" id="imagem-base64">
                </div>
                <div class="pt-4 flex gap-4">
                    <a href="/novo_produto" class="w-1/3 bg-slate-100 text-slate-600 font-bold text-xs py-3.5 rounded-xl text-center uppercase tracking-wider flex items-center justify-content">Cancelar</a>
                    <button type="submit" class="w-2/3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs py-3.5 rounded-xl uppercase tracking-wider transition-all">Salvar Produto</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('seletor-imagem').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagem-base64').value = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
