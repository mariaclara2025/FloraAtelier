<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora Atelier - Editar Buquê</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f0ff', 100: '#ebdeff', 200: '#dac2ff', 300: '#c199ff',
                            400: '#a366ff', 500: '#8b33ff', 600: '#751ae6', 700: '#6010bf',
                            800: '#500e9e', 950: '#1b003a',
                        },
                        accent: {
                            pink: '#f472b6', lavender: '#e9d5ff', emerald: '#10b981', rose: '#f43f5e', amber: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&family=Playfair+Display:wght=600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-purple-100 px-6 py-4">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">💐</span>
                <span class="font-serif font-extrabold text-xl tracking-wide bg-gradient-to-r from-brand-600 to-accent-pink bg-clip-text text-transparent">Painel Admin</span>
            </div>
            <a href="/painel_admin" class="text-xs font-semibold text-brand-600 hover:text-brand-700 transition-colors flex items-center space-x-1">
                <span>←</span> <span>Voltar ao Painel</span>
            </a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-8 w-full flex-grow flex items-center justify-center">
        
        <section class="bg-white border border-purple-100 rounded-3xl shadow-sm p-6 md:p-8 space-y-6 w-full">
            <div class="text-center md:text-left">
                <h2 class="font-serif text-xl font-bold text-slate-900">Editar Detalhes do Buquê</h2>
                <p class="text-xs text-slate-400">Modifique as informações exibidas na vitrine do cliente.</p>
            </div>

            <!-- Formulário enviando os dados completos para a rota de edição -->
            <form action="/editar_produto/{{ produto[0] }}" method="POST" class="space-y-4">
                
                <!-- Nome do Buquê -->
                <div class="flex flex-col space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Nome do Buquê</label>
                    <input type="text" name="nome" value="{{ produto[1] }}" required[cite: 7]
                        class="w-full bg-slate-50 border border-slate-200 focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-100 rounded-xl px-4 py-2.5 text-sm transition-all outline-none">
                </div>

                <!-- Descrição do Buquê -->
                <div class="flex flex-col space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Descrição Detalhada</label>
                    <textarea name="descricao" rows="3" required
                        class="w-full bg-slate-50 border border-slate-200 focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-100 rounded-xl px-4 py-2.5 text-sm transition-all outline-none resize-none">{{ produto[2] }}</textarea>
                </div>

                <!-- Linha Dupla: Preço e Categoria -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Preço (R$)</label>
                        <input type="number" step="0.01" name="preco" value="{{ produto[3] }}" required[cite: 7]
                            class="w-full bg-slate-50 border border-slate-200 focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-100 rounded-xl px-4 py-2.5 text-sm transition-all outline-none">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Categoria</label>
                        <select name="categoria" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none cursor-pointer text-slate-700">
                            <option value="Buquê Completo" {% if produto[7] == 'Buquê Completo' %}selected{% endif %}>Buquê Completo</option>
                            <option value="Flor Individual" {% if produto[7] == 'Flor Individual' %}selected{% endif %}>Flor Individual</option>
                            <option value="Edição Limitada" {% if produto[7] == 'Edição Limitada' %}selected{% endif %}>Edição Limitada</option>
                        </select>
                    </div>
                </div>

                <!-- Nome do Arquivo da Imagem -->
                <div class="flex flex-col space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Nome do Arquivo de Imagem</label>
                    <input type="text" name="imagem" value="{{ produto[4] }}" required placeholder="Ex: BuqueGirassol.jpeg"
                        class="w-full bg-slate-50 border border-slate-200 focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-100 rounded-xl px-4 py-2.5 text-sm transition-all outline-none">
                    <p class="text-[10px] text-slate-400 italic pl-1">Digite apenas o nome da foto com a extensão (ex: .jpeg, .jpg ou .png).</p>
                </div>

                <!-- Linha Dupla: Padrão e Cores -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Padrão / Tipo</label>
                        <input type="text" name="padrao" value="{{ produto[5] }}" placeholder="Ex: Padrão, Premium, Luxo"
                            class="w-full bg-slate-50 border border-slate-200 focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-100 rounded-xl px-4 py-2.5 text-sm transition-all outline-none">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Paleta de Cores</label>
                        <input type="text" name="cores" value="{{ produto[6] }}" placeholder="Ex: Amarelo, Marrom e Verde"
                            class="w-full bg-slate-50 border border-slate-200 focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-100 rounded-xl px-4 py-2.5 text-sm transition-all outline-none">
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <a href="/painel_admin" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs px-6 py-3 rounded-xl transition-all uppercase tracking-wider flex items-center justify-center">
                        Cancelar
                    </a>
                    <button type="submit" 
                        class="bg-brand-500 hover:bg-brand-600 text-white font-semibold text-xs px-6 py-3 rounded-xl transition-all shadow-sm text-center uppercase tracking-wider">
                        Salvar Alterações
                    </button>
                </div>
            </form>
        </section>

    </main>

    <footer class="text-slate-400 text-[11px] py-4 text-center border-t border-slate-100 bg-white mt-12">
        &copy; 2026 Flora Atelier • Painel Administrativo de Produtos.
    </footer>

</body>
</html>
